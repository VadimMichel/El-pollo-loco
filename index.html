<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL POLLO LOCO</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./fonts.css">
    <script src="./scripts/models/game-sounds.class.js"></script>
    <script src="./scripts/models/drawable-object.class.js"></script>
    <script src="./scripts/models/moveble-object.class.js"></script>
    <script src="./scripts/models/character.class.js"></script>
    <script src="./scripts/models/chicken.class.js"></script>  
    <script src="./scripts/models/cloud.class.js"></script>
    <script src="./scripts/models/background-objects.class.js"></script>
    <script src="./scripts/models/endboss.class.js"></script>
    <script src="./scripts/models/throwable-object.class.js"></script>
    <script src="./scripts/models/status-bar.class.js"></script>
    <script src="./scripts/models/collectable-object.class.js"></script>
    <script src="./scripts/models/world.class.js"></script>
    <script src="./scripts/models/keyboard.class.js"></script> 
    <script src="./scripts/models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./scripts/game.js"></script>
    <link rel="shortcut icon" href="./img/icon/favicon.ico" type="image/x-icon">
</head>
<body onload="getFromLocalStorage()">
    <h1>EL POLLO LOCO</h1>
    <div id="topBtnContent" class="d-none icons setting-botton">
        <img class="d-none" id="unMuteButton" onclick="GameSounds.unMuteGame('')" src="./img/icon/volume-off-solid.svg" alt="volume off">
        <img id="muteButton" onclick="GameSounds.muteGame('')" src="./img/icon/volume-xmark-solid.svg" alt="volume on">
        <img onclick="restartGame()" src="./img/icon/reply-solid.svg" alt="replay">
        <img onclick="displayGamePad()" src="./img/icon/gamepad-solid.svg" alt="gamepad">
    </div>
    <div class="game-contant">
        <div class="button-container" id="contentWrapper">
            <button onclick="startGameBotton()" class="western-button">START</button>
        </div>
        <div id="winLoseContent" class="overlay d-none">
            <div  class="win-lose-content" >
                <div id="winLoseContentImg">
                    <img src="./img/You won, you lost/Game over A.png" alt="">
                </div>
                <div class="d-flex">
                    <button onclick="restartGame()" class="western-button">PLAY AGAIN</button>
                    <button onclick="reloadPage()" class="western-button">Back to Start</button>
                </div>
            </div>
        </div>
    </div>
    <div id="gamepadContent" class="keys icons fullscreen-hide d-none">
        <div>
            <img id="btnLeft" src="./img/icon/caret-left-solid.svg" alt="arrow-left">
            <img id="btnRight" src="./img/icon/caret-right-solid.svg" alt="arrow-right">
        </div>
        <div>
            <img id="btnUp" src="./img/icon/caret-up-solid.svg" alt="arrow-up">
            <img id="btnThrow" src="./img/icon/wine-bottle-solid.svg" alt="bottle">
        </div>
    </div>
    <div class="key-info">
        <span>KEY BINDINGS:</span>
        <div>
            <img src="./img/icon/caret-left-solid.svg" alt="arrow-left"><span>: LEFT |</span>
            <img src="./img/icon/caret-right-solid.svg" alt="arrow-right"><span>: RIGHT |</span>
        </div>
        <div>
            <img src="./img/icon/caret-up-solid.svg" alt="arrow-up"> <span>/ SPACE : JUMP |</span> 
            <span>TROW : D</span>
        </div>
    </div>
    <div id="rotateOverlay">
        <span>Please rotate your device</span>
    </div>
    <a class="link" target="blank" href="./legal_notice.html">Imprint / Legal Notice</a>
</body>
</html>
